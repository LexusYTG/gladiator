name: Move release assets from gladiator-app

on:
  workflow_dispatch:

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assets from gladiator-app
        run: |
          mkdir -p /tmp/assets
          for v in v1.2.0 v1.2.1 v1.3; do
            curl -sL -o "/tmp/assets/$v.apk" \
              "https://github.com/LexusYTG/gladiator-app/releases/download/$v/app-debug.apk"
            ls -la "/tmp/assets/$v.apk"
          done

      - name: Create releases in gladiator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for v in v1.2.0 v1.2.1 v1.3; do
            gh release create "$v" "/tmp/assets/$v.apk#gladiator-$v.apk" \
              --repo LexusYTG/gladiator \
              --title "Gladiator $v" \
              --notes "APK de la version $v. Ver CHANGELOG.md." || true
          done

      - name: List result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release list --repo LexusYTG/gladiator
